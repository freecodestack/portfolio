services:
  payload:
    image: freecodestack/portfolio:latest
    ports:
      - '80:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongo:27017/selfolio_prod

    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    volumes:
      - prod_data:/data/db

volumes:
  prod_data:
