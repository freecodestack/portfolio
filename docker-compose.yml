services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile # আপনার ঐ প্রোডাকশন Dockerfile টি ব্যবহার হবে
    ports:
      - '80:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/payload-prod
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    # প্রোডাকশনে পোর্ট বাইরে না রাখাই ভালো, শুধু কন্টেইনার টু কন্টেইনার কথা বলবে
    volumes:
      - prod_data:/data/db

volumes:
  prod_data:
